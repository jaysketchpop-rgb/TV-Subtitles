<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Captions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6EBF1;
    --surface: #FFFFFF;
    --ink: #1A2230;
    --muted: #586375;
    --accent: #9A6A00;
    --live: #C8352B;
    --box: rgba(16, 20, 28, 0.88);
    --caption: #FFFFFF;
    --size: 44px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121822;
      --surface: #1C2431;
      --ink: #E8ECF2;
      --muted: #97A2B2;
      --accent: #F2B544;
      --live: #FF6B5E;
      --box: rgba(0, 0, 0, 0.8);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  .bar {
    background: var(--surface);
    padding: 14px max(18px, env(safe-area-inset-left)) 14px max(18px, env(safe-area-inset-right));
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 18px;
    border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent);
  }
  .title { font-weight: 700; font-size: 20px; margin-right: auto; display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  body.listening .dot { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { body.listening .dot { animation: none; } }
  .status { font-weight: 400; font-size: 15px; color: var(--muted); }

  button, select {
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid color-mix(in srgb, var(--muted) 45%, transparent);
    border-radius: 10px;
    padding: 9px 14px;
    min-height: 44px;
  }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #toggle {
    background: var(--accent);
    border-color: var(--accent);
    color: #141414;
    font-weight: 700;
    min-width: 140px;
  }
  body.listening #toggle { background: transparent; color: var(--ink); border-color: var(--live); }
  label.ctl { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
  input[type=range] { width: 120px; accent-color: var(--accent); }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
    padding: 24px 24px max(40px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .line {
    margin: 0;
    max-width: 92%;
    padding: 0.12em 0.45em;
    background: var(--box);
    color: var(--caption);
    font-size: var(--size);
    line-height: 1.3;
    font-weight: 700;
    text-align: center;
    border-radius: 6px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .line.old { opacity: 0.6; }
  .line.interim { opacity: 1; }

  .hint { max-width: 34em; margin: auto; text-align: center; color: var(--muted); font-size: 18px; line-height: 1.55; }
  .hint strong { color: var(--ink); }
  .error { color: var(--live); }

  body.immersive .bar { display: none; }
  body.immersive { background: #000; }
</style>
</head>
<body>
  <header class="bar">
    <div class="title"><span class="dot" aria-hidden="true"></span>TV Captions <span class="status" id="status">Stopped</span></div>
    <button id="toggle">Start captions</button>
    <label class="ctl">Text size <input type="range" id="size" min="24" max="96" value="44"></label>
    <select id="colour" aria-label="Caption colour">
      <option value="#FFFFFF">White text</option>
      <option value="#FFE14D">Yellow text</option>
    </select>
    <select id="lang" aria-label="Accent">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="en-AU">English (Australia)</option>
      <option value="en-IN">English (India)</option>
    </select>
    <button id="clear">Clear</button>
    <button id="hide">Hide controls</button>
  </header>

  <main class="stage" id="stage" aria-live="polite">
    <p class="hint" id="hint">
      Put your iPad close to the TV speaker, then tap <strong>Start captions</strong> and allow the microphone.
      Tap <strong>Hide controls</strong> for a full caption screen; tap anywhere to bring the controls back.
    </p>
  </main>

<script>
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggle');
  // Live-only captions: one line, just the words being spoken right now
  const SHOW_WORDS = 10;        // words visible at once
  const HIDE_AFTER_MS = 1500;   // clear the caption after this much silence
  const SESSION_MS = 5000;      // restart recognition often so Safari stays fast
  const MAX_SESSION_WORDS = 14; // or after this many words

  let rec = null;
  let wanted = false;       // user wants captions running
  let finals = [];          // kept for the Clear button; not shown
  let interim = '';
  let wakeLock = null;
  let sessionStart = 0;
  let hideTimer = null;
  let captionEl = null;
  let pendingText = null;

  function setStatus(text) { statusEl.textContent = text; }

  function showMessage(html, isError) {
    stage.innerHTML = '';
    captionEl = null;
    const p = document.createElement('p');
    p.className = 'hint' + (isError ? ' error' : '');
    p.innerHTML = html;
    stage.appendChild(p);
  }

  if (!SR) {
    toggleBtn.disabled = true;
    showMessage('This browser does not support live speech recognition. Open this page in <strong>Safari</strong> on iPad (iPadOS 14.5 or later) or in Chrome on a computer.', true);
  }

  function lastWords(text) {
    const words = text.trim().split(/\s+/).filter(Boolean);
    return words.slice(-SHOW_WORDS).join(' ');
  }

  // Reuse one element and only change its text: much cheaper than rebuilding the page
  function paint() {
    const text = pendingText;
    pendingText = null;
    if (text === null) return;
    if (!captionEl) {
      stage.innerHTML = '';
      captionEl = document.createElement('p');
      captionEl.className = 'line';
      stage.appendChild(captionEl);
    }
    captionEl.textContent = text;
    captionEl.style.visibility = text ? 'visible' : 'hidden';
  }

  function show(text) {
    const needsFrame = pendingText === null;
    pendingText = text;
    if (needsFrame) requestAnimationFrame(paint);
    clearTimeout(hideTimer);
    if (text) hideTimer = setTimeout(() => show(''), HIDE_AFTER_MS);
  }

  function render() { show(''); }

  function startRec() {
    rec = new SR();
    rec.lang = document.getElementById('lang').value;
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    sessionStart = Date.now();
    const thisRec = rec;

    rec.onresult = (e) => {
      // Take only the newest result: that's what is being said right now
      const r = e.results[e.results.length - 1];
      const text = r[0].transcript;
      if (!text.trim()) return;
      interim = r.isFinal ? '' : text;
      show(lastWords(text));

      // Restart often: long sessions are what make Safari lag
      let total = 0;
      for (let i = 0; i < e.results.length; i++) total += e.results[i][0].transcript.trim().split(/\s+/).length;
      if (Date.now() - sessionStart > SESSION_MS || total > MAX_SESSION_WORDS) {
        try { thisRec.abort(); } catch (err) {}
      }
    };

    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wanted = false;
        updateUI();
        showMessage('The microphone or speech recognition is blocked. Allow the microphone for Safari in Settings, and check that Dictation is turned on (Settings → General → Keyboard). Then reload this page.', true);
      }
      // 'no-speech', 'aborted', 'network' just restart via onend
    };

    rec.onend = () => {
      interim = '';
      if (wanted && rec === thisRec) startRec(); // restart straight away, no gap
    };

    try { rec.start(); } catch (err) { /* already started */ }
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && wanted) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) { /* not available */ }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wanted) keepAwake();
  });

  function updateUI() {
    document.body.classList.toggle('listening', wanted);
    toggleBtn.textContent = wanted ? 'Stop captions' : 'Start captions';
    setStatus(wanted ? 'Listening' : 'Stopped');
  }

  toggleBtn.addEventListener('click', () => {
    wanted = !wanted;
    updateUI();
    if (wanted) {
      if (!finals.length) showMessage('Listening… captions will appear here when the TV speaks.');
      startRec();
      keepAwake();
    } else {
      if (rec) rec.stop();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      interim = '';
      show('');
    }
  });

  document.getElementById('size').addEventListener('input', (e) => {
    document.documentElement.style.setProperty('--size', e.target.value + 'px');
  });

  document.getElementById('colour').addEventListener('change', (e) => {
    document.documentElement.style.setProperty('--caption', e.target.value);
  });

  document.getElementById('lang').addEventListener('change', () => {
    if (wanted && rec) rec.stop(); // restarts with the new accent
  });

  document.getElementById('clear').addEventListener('click', () => {
    finals = []; interim = '';
    stage.innerHTML = '';
    captionEl = null;
  });

  document.getElementById('hide').addEventListener('click', (e) => {
    e.stopPropagation();
    document.body.classList.add('immersive');
  });

  stage.addEventListener('click', () => document.body.classList.remove('immersive'));
</script>
</body>
</html>
